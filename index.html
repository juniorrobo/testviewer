<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VIDAA Smart TV IPTV Player</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    :root {
      --bg: #090c10;
      --panel-bg: #111622;
      --card-bg: #171e2c;
      --card-hover: #1f293d;
      --accent: #2563eb;
      --accent-bright: #3b82f6;
      --text: #f8fafc;
      --text-dim: #94a3b8;
      --border: #232d3f;
      --danger: #ef4444;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      height: 100vh; width: 100vw;
      overflow: hidden;
      display: flex; flex-direction: column;
    }

    /* Top Bar Header */
    #header {
      height: 54px;
      background: #0d111a;
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 20px;
    }
    .brand { font-size: 18px; font-weight: 800; color: #fff; letter-spacing: 0.5px; }
    .brand span { color: var(--accent-bright); }

    .nav-tabs { display: flex; gap: 6px; background: #05070a; padding: 3px; border-radius: 8px; border: 1px solid var(--border); }
    .tab { padding: 6px 14px; font-size: 12px; font-weight: 700; color: var(--text-dim); border-radius: 6px; cursor: pointer; }
    .tab.active { background: var(--accent); color: #fff; }

    .header-info { display: flex; align-items: center; gap: 12px; font-size: 13px; color: var(--text-dim); }

    /* Main Dashboard */
    #dashboard { flex: 1; display: flex; height: calc(100vh - 54px); }

    #col-cats { width: 280px; background: var(--panel-bg); border-right: 1px solid var(--border); overflow-y: auto; list-style: none; }
    #col-items { width: 380px; background: var(--card-bg); border-right: 1px solid var(--border); overflow-y: auto; list-style: none; }
    #col-preview { flex: 1; display: flex; flex-direction: column; background: #000; position: relative; }

    .list-item {
      padding: 12px 16px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.03);
      display: flex; align-items: center; gap: 12px;
      cursor: pointer; color: var(--text-dim); font-size: 13px;
    }
    .list-item img { width: 28px; height: 28px; object-fit: contain; border-radius: 4px; background: #000; }
    .list-item .title { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .focused { background-color: var(--accent) !important; color: #fff !important; outline: 2px solid #60a5fa; z-index: 10; }
    .selected { background-color: var(--card-hover); color: #fff; font-weight: 600; }

    /* Inline Preview */
    #preview-player-box { flex: 1; position: relative; background: #000; display: flex; align-items: center; justify-content: center; }
    #preview-video { width: 100%; height: 100%; object-fit: contain; }

    #meta-panel { height: 100px; background: #0a0e17; border-top: 1px solid var(--border); padding: 16px; display: flex; flex-direction: column; justify-content: center; }
    #meta-title { font-size: 16px; font-weight: 700; margin-bottom: 4px; }
    #meta-sub { font-size: 12px; color: var(--text-dim); }

    /* Fullscreen Player Overlay */
    #player-overlay {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: #000; z-index: 999; display: none; flex-direction: column;
    }
    #full-video { width: 100%; height: 100%; object-fit: contain; }
    #player-osd {
      position: absolute; bottom: 0; left: 0; right: 0;
      background: linear-gradient(transparent, rgba(0,0,0,0.9));
      padding: 30px; display: flex; justify-content: space-between; align-items: flex-end;
    }
    .osd-title { font-size: 24px; font-weight: 800; color: #fff; }
    .osd-status { font-size: 14px; color: var(--accent-bright); font-weight: 700; margin-top: 4px; }
    .osd-hint { font-size: 12px; color: var(--text-dim); }

    /* Settings Modal */
    .modal { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.85); z-index: 1000; display: none; align-items: center; justify-content: center; }
    .dialog { background: #18202c; padding: 24px; border-radius: 10px; width: 400px; border: 1px solid var(--border); }
    .dialog h3 { margin-bottom: 12px; }
    .dialog input { width: 100%; padding: 10px; margin-bottom: 12px; background: #0a0d14; border: 1px solid var(--border); color: #fff; border-radius: 6px; }
    .dialog-btns { display: flex; justify-content: flex-end; gap: 8px; }
    .btn { padding: 8px 14px; border: none; border-radius: 6px; cursor: pointer; font-weight: 700; font-size: 12px; }
    .btn-blue { background: var(--accent); color: #fff; }
    .btn-gray { background: #334155; color: #fff; }
  </style>
</head>
<body>

  <div id="header">
    <div class="brand">VIDAA<span>PLAYER</span></div>
    <div class="nav-tabs">
      <div class="tab active" id="tab-live" onclick="switchSection('live')">CHANNELS</div>
      <div class="tab" id="tab-vod" onclick="switchSection('vod')">MOVIES</div>
      <div class="tab" id="tab-series" onclick="switchSection('series')">SERIES</div>
      <div class="tab" id="tab-radio" onclick="switchSection('radio')">RADIO</div>
    </div>
    <div class="header-info">
      <button class="btn btn-gray" onclick="openLogin()">Server Settings</button>
      <div id="clock">--:--</div>
    </div>
  </div>

  <div id="dashboard">
    <ul id="col-cats"></ul>
    <ul id="col-items"></ul>

    <div id="col-preview">
      <div id="preview-player-box">
        <video id="preview-video" autoplay muted playsinline></video>
      </div>
      <div id="meta-panel">
        <div id="meta-title">Select Content</div>
        <div id="meta-sub">Press OK or RIGHT to open Fullscreen Player</div>
      </div>
    </div>
  </div>

  <!-- Dedicated Fullscreen Player Overlay -->
  <div id="player-overlay">
    <video id="full-video" autoplay playsinline></video>
    <div id="player-osd">
      <div>
        <div class="osd-title" id="full-title">Channel Name</div>
        <div class="osd-status" id="full-status">CONNECTING STREAM...</div>
      </div>
      <div class="osd-hint">Press [BACK / ESC] to Exit Fullscreen</div>
    </div>
  </div>

  <!-- Settings Dialog -->
  <div id="login-modal" class="modal">
    <div class="dialog">
      <h3>Xtream Credentials</h3>
      <input type="text" id="cfg-server" placeholder="http://domain.com:8080" />
      <input type="text" id="cfg-user" placeholder="Username" />
      <input type="password" id="cfg-pass" placeholder="Password" />
      <div class="dialog-btns">
        <button class="btn btn-gray" onclick="closeLogin()">Cancel</button>
        <button class="btn btn-blue" onclick="saveLogin()">Connect</button>
      </div>
    </div>
  </div>

  <script>
    let serverUrl = '', username = '', password = '';
    let currentSection = 'live'; // live, vod, series, radio
    let categoryList = [];
    let currentItemList = [];

    // Focus state: -1 = Tabs, 0 = Categories, 1 = Items, 2 = Fullscreen
    let focusCol = 0;
    let tabIdx = 0;
    let catIdx = 0;
    let itemIdx = 0;

    const tabs = ['live', 'vod', 'series', 'radio'];
    const pVideo = document.getElementById('preview-video');
    const fVideo = document.getElementById('full-video');
    let previewHls = null;
    let fullHls = null;

    setInterval(() => {
      document.getElementById('clock').textContent = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }, 1000);

    window.addEventListener('DOMContentLoaded', () => {
      serverUrl = localStorage.getItem('xc_server') || '';
      username = localStorage.getItem('xc_user') || '';
      password = localStorage.getItem('xc_pass') || '';

      if (serverUrl && username && password) {
        loadCategories();
      } else {
        openLogin();
      }
    });

    function openLogin() {
      document.getElementById('cfg-server').value = serverUrl;
      document.getElementById('cfg-user').value = username;
      document.getElementById('cfg-pass').value = password;
      document.getElementById('login-modal').style.display = 'flex';
    }
    function closeLogin() { document.getElementById('login-modal').style.display = 'none'; }

    function saveLogin() {
      serverUrl = document.getElementById('cfg-server').value.trim().replace(/\/$/, "");
      username = document.getElementById('cfg-user').value.trim();
      password = document.getElementById('cfg-pass').value.trim();

      if (!serverUrl.startsWith('http://') && !serverUrl.startsWith('https://')) {
        serverUrl = 'http://' + serverUrl;
      }

      localStorage.setItem('xc_server', serverUrl);
      localStorage.setItem('xc_user', username);
      localStorage.setItem('xc_pass', password);
      closeLogin();
      loadCategories();
    }

    async function fetchFast(url) {
      try {
        const res = await fetch(url);
        if (res.ok) return await res.json();
      } catch (e) {
        // Proxy Fallback for API calls
        try {
          const proxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`;
          const res = await fetch(proxyUrl);
          if (res.ok) return await res.json();
        } catch (err) {
          console.warn("Fetch failed:", url);
        }
      }
      return null;
    }

    function switchSection(sec) {
      currentSection = sec;
      tabIdx = tabs.indexOf(sec);
      document.querySelectorAll('.tab').forEach((t, i) => {
        t.classList.toggle('active', i === tabIdx);
      });
      catIdx = 0; itemIdx = 0;
      loadCategories();
    }

    async function loadCategories() {
      document.getElementById('col-cats').innerHTML = '<li class="list-item"><span class="title">Loading...</span></li>';
      document.getElementById('col-items').innerHTML = '';

      let action = 'get_live_categories';
      if (currentSection === 'vod') action = 'get_vod_categories';
      if (currentSection === 'series') action = 'get_series_categories';

      const url = `${serverUrl}/player_api.php?username=${encodeURIComponent(username)}&password=${encodeURIComponent(password)}&action=${action}`;
      let data = await fetchFast(url);

      if (data && Array.isArray(data)) {
        if (currentSection === 'radio') {
          data = data.filter(c => c.category_name.toLowerCase().includes('radio') || c.category_name.toLowerCase().includes('fm'));
        }
        categoryList = data;
        renderCategories();
        if (categoryList.length > 0) loadItems(0);
      }
    }

    function renderCategories() {
      const container = document.getElementById('col-cats');
      container.innerHTML = '';
      categoryList.forEach((cat, idx) => {
        const li = document.createElement('li');
        li.className = 'list-item' + (idx === catIdx ? ' selected' : '');
        li.id = `cat-${idx}`;
        li.innerHTML = `<span class="title">${cat.category_name}</span>`;
        li.onclick = () => { catIdx = idx; loadItems(idx); };
        container.appendChild(li);
      });
      updateFocus();
    }

    async function loadItems(cIdx) {
      catIdx = cIdx;
      const cat = categoryList[cIdx];
      if (!cat) return;

      document.getElementById('col-items').innerHTML = '<li class="list-item"><span class="title">Loading...</span></li>';

      let action = 'get_live_streams';
      if (currentSection === 'vod') action = 'get_vod_streams';
      if (currentSection === 'series') action = 'get_series';

      const url = `${serverUrl}/player_api.php?username=${encodeURIComponent(username)}&password=${encodeURIComponent(password)}&action=${action}&category_id=${encodeURIComponent(cat.category_id)}`;
      const data = await fetchFast(url);

      if (data && Array.isArray(data)) {
        currentItemList = data;
        itemIdx = 0;
        renderItems();
      } else {
        currentItemList = [];
        document.getElementById('col-items').innerHTML = '<li class="list-item"><span class="title">Empty category</span></li>';
      }
    }

    function renderItems() {
      const container = document.getElementById('col-items');
      container.innerHTML = '';
      currentItemList.forEach((item, idx) => {
        const li = document.createElement('li');
        li.className = 'list-item';
        li.id = `item-${idx}`;

        const name = item.name || item.title;
        const icon = item.stream_icon || item.cover || '';

        li.innerHTML = `
          ${icon ? `<img src="${icon}" onerror="this.style.display='none'"/>` : ''}
          <span class="title">${name}</span>
        `;
        li.onclick = () => { itemIdx = idx; playStream(false); };
        container.appendChild(li);
      });
      updateFocus();
    }

    // Dynamic Stream Loader Engine with Mixed Content / Proxy Handling
    function playStream(fullScreen = false) {
      const item = currentItemList[itemIdx];
      if (!item) return;

      const title = item.name || item.title;
      document.getElementById('meta-title').textContent = title;
      document.getElementById('meta-sub').textContent = `Stream ID: ${item.stream_id || item.series_id}`;

      let m3u8Url = '', tsUrl = '', vodUrl = '';

      if (currentSection === 'vod') {
        const ext = item.container_extension || 'mp4';
        vodUrl = `${serverUrl}/movie/${encodeURIComponent(username)}/${encodeURIComponent(password)}/${item.stream_id}.${ext}`;
      } else {
        m3u8Url = `${serverUrl}/live/${encodeURIComponent(username)}/${encodeURIComponent(password)}/${item.stream_id}.m3u8`;
        tsUrl = `${serverUrl}/live/${encodeURIComponent(username)}/${encodeURIComponent(password)}/${item.stream_id}.ts`;
      }

      const targetVideo = fullScreen ? fVideo : pVideo;
      let activeHls = fullScreen ? fullHls : previewHls;

      if (fullScreen) {
        focusCol = 2;
        document.getElementById('full-title').textContent = title;
        document.getElementById('full-status').textContent = 'CONNECTING STREAM...';
        document.getElementById('player-overlay').style.display = 'flex';
      }

      if (activeHls) activeHls.destroy();

      if (currentSection === 'vod') {
        targetVideo.src = vodUrl;
        targetVideo.play().catch(e => console.log("VOD playback error:", e));
        return;
      }

      // HLS setup with automatic proxying for HTTP chunks on HTTPS page
      if (Hls.isSupported()) {
        activeHls = new Hls({
          enableWorker: true,
          lowLatencyMode: true,
          xhrSetup: function (xhr, url) {
            // Route http segments via proxy if current page is https
            if (window.location.protocol === 'https:' && url.startsWith('http:')) {
              xhr.open('GET', `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`, true);
            }
          }
        });

        let playSource = m3u8Url;
        if (window.location.protocol === 'https:' && playSource.startsWith('http:')) {
          playSource = `https://api.allorigins.win/raw?url=${encodeURIComponent(playSource)}`;
        }

        activeHls.loadSource(playSource);
        activeHls.attachMedia(targetVideo);

        activeHls.on(Hls.Events.MANIFEST_PARSED, () => {
          if (fullScreen) document.getElementById('full-status').textContent = 'LIVE PLAYBACK';
          targetVideo.play().catch(e => console.log("HLS play error:", e));
        });

        activeHls.on(Hls.Events.ERROR, (event, data) => {
          if (data.fatal) {
            console.warn("HLS fatal error. Attempting TS stream fallback...");
            if (activeHls) activeHls.destroy();
            targetVideo.src = tsUrl;
            targetVideo.play().catch(err => console.log("TS Direct Play error:", err));
          }
        });

        if (fullScreen) fullHls = activeHls; else previewHls = activeHls;

      } else if (targetVideo.canPlayType('application/vnd.apple.mpegurl')) {
        targetVideo.src = m3u8Url;
        targetVideo.play();
      } else {
        targetVideo.src = tsUrl;
        targetVideo.play();
      }
    }

    function closeFullscreen() {
      focusCol = 1;
      if (fullHls) { fullHls.destroy(); fullHls = null; }
      fVideo.pause();
      fVideo.src = '';
      document.getElementById('player-overlay').style.display = 'none';
      updateFocus();
    }

    function updateFocus() {
      document.querySelectorAll('.focused').forEach(e => e.classList.remove('focused'));

      if (focusCol === -1) {
        const t = document.getElementById(`tab-${tabs[tabIdx]}`);
        if (t) t.classList.add('focused');
      } else if (focusCol === 0) {
        const c = document.getElementById(`cat-${catIdx}`);
        if (c) { c.classList.add('focused'); c.scrollIntoView({ block: 'nearest' }); }
      } else if (focusCol === 1) {
        const i = document.getElementById(`item-${itemIdx}`);
        if (i) { i.classList.add('focused'); i.scrollIntoView({ block: 'nearest' }); }
      }
    }

    // VIDAA TV D-Pad Remote Navigation
    window.addEventListener('keydown', (e) => {
      if (document.getElementById('login-modal').style.display === 'flex') return;

      if (focusCol === 2) { // Fullscreen Player Controls
        if (e.keyCode === 27 || e.keyCode === 10009 || e.keyCode === 8) { // BACK / ESC
          closeFullscreen();
        }
        return;
      }

      switch(e.keyCode) {
        case 38: // UP
          if (focusCol === 0 && catIdx > 0) { catIdx--; updateFocus(); }
          else if (focusCol === 1 && itemIdx > 0) { itemIdx--; updateFocus(); }
          else if (focusCol === 0 && catIdx === 0) { focusCol = -1; updateFocus(); }
          break;

        case 40: // DOWN
          if (focusCol === -1) { focusCol = 0; updateFocus(); }
          else if (focusCol === 0 && catIdx < categoryList.length - 1) { catIdx++; updateFocus(); }
          else if (focusCol === 1 && itemIdx < currentItemList.length - 1) { itemIdx++; updateFocus(); }
          break;

        case 37: // LEFT
          if (focusCol === -1 && tabIdx > 0) { switchSection(tabs[tabIdx - 1]); }
          else if (focusCol === 1) { focusCol = 0; updateFocus(); }
          break;

        case 39: // RIGHT
          if (focusCol === -1 && tabIdx < tabs.length - 1) { switchSection(tabs[tabIdx + 1]); }
          else if (focusCol === 0) { focusCol = 1; loadItems(catIdx); }
          else if (focusCol === 1) { playStream(true); } // Launch Fullscreen Video
          break;

        case 13: // ENTER / OK
          if (focusCol === -1) { switchSection(tabs[tabIdx]); focusCol = 0; }
          else if (focusCol === 0) { focusCol = 1; loadItems(catIdx); }
          else if (focusCol === 1) { playStream(true); } // Launch Fullscreen Video
          break;
      }
    });
  </script>
</body>
</html>
