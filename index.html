<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart TV IPTV Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    :root {
      --bg: #0b0e14;
      --card-bg: #141a24;
      --card-active: #1d2636;
      --accent: #2563eb;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border: #232d3f;
      --locked: #ef4444;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background-color: var(--bg);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    #top-bar {
      height: 60px;
      background: #0f141d;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 32px;
    }
    .brand { font-size: 20px; font-weight: 700; color: #fff; }
    .brand span { color: var(--accent); }
    .top-actions { display: flex; gap: 16px; align-items: center; }
    .status-clock { color: var(--text-muted); font-size: 15px; font-weight: 500; }

    #dashboard {
      flex: 1;
      display: flex;
      height: calc(100vh - 60px);
      position: relative;
    }

    /* Col 1: Categories */
    #col-categories {
      width: 260px;
      background: #111622;
      border-right: 1px solid var(--border);
      overflow-y: auto;
      list-style: none;
    }
    /* Col 2: Channels */
    #col-channels {
      width: 380px;
      background: var(--card-bg);
      border-right: 1px solid var(--border);
      overflow-y: auto;
      list-style: none;
    }
    /* Col 3: Preview */
    #col-preview {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: #000;
      position: relative;
    }

    .nav-item {
      padding: 16px 20px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      color: var(--text-muted);
    }
    .nav-item img {
      width: 32px;
      height: 32px;
      border-radius: 4px;
      object-fit: contain;
      background: #0b0e14;
    }
    .locked-badge {
      margin-left: auto;
      background: var(--locked);
      color: #fff;
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 700;
    }

    .focused {
      background-color: var(--accent) !important;
      color: #fff !important;
      outline: 3px solid #60a5fa;
      z-index: 5;
    }
    .selected {
      background-color: var(--card-active);
      color: #fff;
      font-weight: 600;
    }

    #video-wrapper {
      flex: 1;
      position: relative;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    video { width: 100%; height: 100%; object-fit: contain; }

    #channel-meta {
      padding: 24px;
      background: #0d121b;
      border-top: 1px solid var(--border);
      height: 120px;
    }
    #meta-title { font-size: 20px; font-weight: 600; margin-bottom: 6px; }
    #meta-sub { font-size: 14px; color: var(--text-muted); }

    /* Modal dialogs */
    .modal-overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(8px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }
    .dialog-box {
      background: #19202c;
      padding: 32px;
      border-radius: 12px;
      width: 440px;
      border: 1px solid var(--border);
    }
    .dialog-box h2 { margin-bottom: 16px; text-align: center; }
    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; font-size: 13px; color: var(--text-muted); margin-bottom: 6px; }
    .form-group input {
      width: 100%;
      padding: 12px;
      background: #0d1118;
      border: 1px solid var(--border);
      color: #fff;
      border-radius: 6px;
      font-size: 15px;
    }
    .dialog-actions { display: flex; justify-content: flex-end; gap: 12px; margin-top: 20px; }
    .btn {
      padding: 10px 18px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      font-size: 14px;
    }
    .btn-primary { background: var(--accent); color: white; }
    .btn-secondary { background: #334155; color: white; }

    .fullscreen-mode #col-categories,
    .fullscreen-mode #col-channels,
    .fullscreen-mode #top-bar,
    .fullscreen-mode #channel-meta {
      display: none !important;
    }
    .fullscreen-mode #dashboard { height: 100vh; }
  </style>
</head>
<body>

  <div id="top-bar">
    <div class="brand">DUPLE<span>WEB</span></div>
    <div class="top-actions">
      <button class="btn btn-secondary" onclick="openPinModal()">Set PIN</button>
      <button class="btn btn-secondary" onclick="openLogin()">Server Settings</button>
      <div class="status-clock" id="clock">--:--</div>
    </div>
  </div>

  <div id="dashboard">
    <ul id="col-categories"></ul>
    <ul id="col-channels"></ul>

    <div id="col-preview">
      <div id="video-wrapper">
        <video id="video" autoplay playsinline></video>
      </div>
      <div id="channel-meta">
        <div id="meta-title">Select a Channel</div>
        <div id="meta-sub">D-pad: Up/Down to Scroll • Right for Fullscreen • Left to Switch Panel</div>
      </div>
    </div>
  </div>

  <!-- Xtream Login Modal -->
  <div id="login-dialog" class="modal-overlay">
    <div class="dialog-box">
      <h2>Server Credentials</h2>
      <div class="form-group">
        <label>Server URL</label>
        <input type="text" id="cfg-server" placeholder="http://domain.xyz:8080" />
      </div>
      <div class="form-group">
        <label>Username</label>
        <input type="text" id="cfg-user" placeholder="Enter username" />
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="cfg-pass" placeholder="Enter password" />
      </div>
      <div class="dialog-actions">
        <button class="btn btn-secondary" onclick="closeLogin()">Cancel</button>
        <button class="btn btn-primary" onclick="submitLogin()">Save & Connect</button>
      </div>
    </div>
  </div>

  <!-- Parental Control PIN Prompt Modal -->
  <div id="pin-prompt-dialog" class="modal-overlay">
    <div class="dialog-box">
      <h2>Restricted Category</h2>
      <p style="font-size:14px; color:var(--text-muted); margin-bottom:16px; text-align:center;">Enter your 4-digit PIN to access this section.</p>
      <div class="form-group">
        <input type="password" id="input-pin" maxlength="4" placeholder="••••" style="text-align: center; font-size: 24px; letter-spacing: 8px;" />
      </div>
      <div class="dialog-actions">
        <button class="btn btn-secondary" onclick="closePinPrompt()">Cancel</button>
        <button class="btn btn-primary" onclick="verifyPin()">Unlock</button>
      </div>
    </div>
  </div>

  <script>
    let rawChannels = [];
    let categories = {};
    let activeCategory = 'All';
    let currentChannelList = [];
    let pendingRestrictedCategory = null;

    // Adult/Restricted Keywords
    const restrictedKeywords = ['adult', 'xxx', '18+', 'nsfw', 'for adults', 'erotic'];

    let activeColumn = 1;
    let catIndex = 0;
    let chIndex = 0;
    let isFullscreen = false;

    const video = document.getElementById('video');
    const catContainer = document.getElementById('col-categories');
    const chContainer = document.getElementById('col-channels');
    let hls = null;

    setInterval(() => {
      const now = new Date();
      document.getElementById('clock').textContent = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }, 1000);

    window.addEventListener('DOMContentLoaded', () => {
      // Set default PIN to 0000 if not configured
      if (!localStorage.getItem('parental_pin')) {
        localStorage.setItem('parental_pin', '0000');
      }

      const s = localStorage.getItem('xc_server');
      const u = localStorage.getItem('xc_user');
      const p = localStorage.getItem('xc_pass');

      if (s && u && p) {
        loadData(s, u, p);
      } else {
        openLogin();
      }
    });

    function openLogin() {
      document.getElementById('cfg-server').value = localStorage.getItem('xc_server') || '';
      document.getElementById('cfg-user').value = localStorage.getItem('xc_user') || '';
      document.getElementById('cfg-pass').value = localStorage.getItem('xc_pass') || '';
      document.getElementById('login-dialog').style.display = 'flex';
    }
    function closeLogin() { document.getElementById('login-dialog').style.display = 'none'; }

    function openPinModal() {
      const current = localStorage.getItem('parental_pin') || '0000';
      const nextPin = prompt("Enter a new 4-digit parental control PIN:", current);
      if (nextPin && nextPin.length === 4 && !isNaN(nextPin)) {
        localStorage.setItem('parental_pin', nextPin);
        alert("Parental PIN updated successfully.");
      } else if (nextPin) {
        alert("PIN must be exactly 4 digits.");
      }
    }

    function submitLogin() {
      const s = document.getElementById('cfg-server').value.trim().replace(/\/$/, "");
      const u = document.getElementById('cfg-user').value.trim();
      const p = document.getElementById('cfg-pass').value.trim();
      if (!s || !u || !p) return;

      localStorage.setItem('xc_server', s);
      localStorage.setItem('xc_user', u);
      localStorage.setItem('xc_pass', p);
      closeLogin();
      loadData(s, u, p);
    }

    async function loadData(s, u, p) {
      document.getElementById('meta-title').textContent = "Downloading playlist...";
      const m3uUrl = `${s}/get.php?username=${encodeURIComponent(u)}&password=${encodeURIComponent(p)}&type=m3u_plus&output=m3u8`;

      try {
        const res = await fetch(m3uUrl);
        const text = await res.text();
        parseM3UData(text);
      } catch (e) {
        document.getElementById('meta-title').textContent = "Connection Failed";
        document.getElementById('meta-sub').textContent = "Check Xtream login or CORS setup.";
      }
    }

    function isCategoryRestricted(name) {
      const lower = name.toLowerCase();
      return restrictedKeywords.some(keyword => lower.includes(keyword));
    }

    function parseM3UData(data) {
      const lines = data.split('\n');
      rawChannels = [];
      categories = { 'All': [] };

      let temp = {};
      for (let i = 0; i < lines.length; i++) {
        const line = lines[i].trim();
        if (line.startsWith('#EXTINF:')) {
          const groupMatch = line.match(/group-title="([^"]+)"/);
          const group = groupMatch ? groupMatch[1] : 'General';

          const logoMatch = line.match(/tvg-logo="([^"]+)"/);
          const logo = logoMatch ? logoMatch[1] : '';

          const name = line.split(',')[1] || 'Unknown';
          temp = { name: name.trim(), group, logo };
        } else if (line && !line.startsWith('#')) {
          temp.url = line;
          if (temp.name) {
            rawChannels.push(temp);
            if (!categories[temp.group]) categories[temp.group] = [];
            categories[temp.group].push(temp);
            // Hide adult content from "All" category list
            if (!isCategoryRestricted(temp.group)) {
              categories['All'].push(temp);
            }
          }
          temp = {};
        }
      }

      renderCategories();
      selectCategory('All');
    }

    function renderCategories() {
      catContainer.innerHTML = '';
      const catKeys = Object.keys(categories);
      catKeys.forEach((cat, idx) => {
        const li = document.createElement('li');
        li.className = 'nav-item' + (cat === activeCategory ? ' selected' : '');
        li.id = `cat-${idx}`;

        const isLocked = isCategoryRestricted(cat);
        li.innerHTML = `<span>${cat} (${categories[cat].length})</span>` + (isLocked ? `<span class="locked-badge">LOCKED</span>` : '');

        li.onclick = () => handleCategorySelection(cat);
        catContainer.appendChild(li);
      });
    }

    function handleCategorySelection(cat) {
      if (isCategoryRestricted(cat)) {
        pendingRestrictedCategory = cat;
        document.getElementById('input-pin').value = '';
        document.getElementById('pin-prompt-dialog').style.display = 'flex';
      } else {
        selectCategory(cat);
        activeColumn = 1;
        updateFocus();
      }
    }

    function closePinPrompt() {
      document.getElementById('pin-prompt-dialog').style.display = 'none';
      pendingRestrictedCategory = null;
    }

    function verifyPin() {
      const entered = document.getElementById('input-pin').value;
      const expected = localStorage.getItem('parental_pin') || '0000';

      if (entered === expected) {
        const target = pendingRestrictedCategory;
        closePinPrompt();
        selectCategory(target);
        activeColumn = 1;
        updateFocus();
      } else {
        alert("Incorrect PIN.");
        document.getElementById('input-pin').value = '';
      }
    }

    function selectCategory(cat) {
      activeCategory = cat;
      currentChannelList = categories[cat] || [];
      chIndex = 0;
      renderChannels();
    }

    function renderChannels() {
      chContainer.innerHTML = '';
      currentChannelList.forEach((ch, idx) => {
        const li = document.createElement('li');
        li.className = 'nav-item';
        li.id = `ch-${idx}`;

        const img = document.createElement('img');
        img.src = ch.logo || 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="%23666"><rect width="24" height="24" rx="4"/></svg>';
        img.onerror = () => { img.style.display = 'none'; };

        const span = document.createElement('span');
        span.textContent = ch.name;

        li.appendChild(img);
        li.appendChild(span);
        li.onclick = () => { playChannel(idx); };
        chContainer.appendChild(li);
      });
      updateFocus();
    }

    function playChannel(idx) {
      const ch = currentChannelList[idx];
      if (!ch) return;

      document.getElementById('meta-title').textContent = ch.name;
      document.getElementById('meta-sub').textContent = ch.group;

      if (Hls.isSupported()) {
        if (hls) hls.destroy();
        hls = new Hls();
        hls.loadSource(ch.url);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, () => video.play());
      } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = ch.url;
        video.play();
      }
    }

    function updateFocus() {
      document.querySelectorAll('.focused').forEach(el => el.classList.remove('focused'));

      if (activeColumn === 0) {
        const el = document.getElementById(`cat-${catIndex}`);
        if (el) {
          el.classList.add('focused');
          el.scrollIntoView({ block: 'nearest' });
        }
      } else if (activeColumn === 1) {
        const el = document.getElementById(`ch-${chIndex}`);
        if (el) {
          el.classList.add('focused');
          el.scrollIntoView({ block: 'nearest' });
        }
      }
    }

    function toggleFullscreen() {
      isFullscreen = !isFullscreen;
      if (isFullscreen) {
        document.body.classList.add('fullscreen-mode');
      } else {
        document.body.classList.remove('fullscreen-mode');
      }
    }

    // Remote D-Pad Navigation
    window.addEventListener('keydown', (e) => {
      // Allow keyboard typing if a popup is visible
      if (document.getElementById('login-dialog').style.display === 'flex' ||
          document.getElementById('pin-prompt-dialog').style.display === 'flex') {
        if (e.keyCode === 13 && document.getElementById('pin-prompt-dialog').style.display === 'flex') {
          verifyPin();
        }
        return;
      }

      switch(e.keyCode) {
        case 38: // UP
          if (activeColumn === 0 && catIndex > 0) {
            catIndex--;
            updateFocus();
          } else if (activeColumn === 1 && chIndex > 0) {
            chIndex--;
            updateFocus();
          }
          break;

        case 40: // DOWN
          const totalCats = Object.keys(categories).length;
          if (activeColumn === 0 && catIndex < totalCats - 1) {
            catIndex++;
            updateFocus();
          } else if (activeColumn === 1 && chIndex < currentChannelList.length - 1) {
            chIndex++;
            updateFocus();
          }
          break;

        case 37: // LEFT
          if (isFullscreen) {
            toggleFullscreen();
          } else if (activeColumn === 1) {
            activeColumn = 0;
            updateFocus();
          }
          break;

        case 39: // RIGHT
          if (activeColumn === 0) {
            const catKey = Object.keys(categories)[catIndex];
            handleCategorySelection(catKey);
          } else if (activeColumn === 1) {
            toggleFullscreen();
          }
          break;

        case 13: // OK / ENTER
          if (activeColumn === 0) {
            const catKey = Object.keys(categories)[catIndex];
            handleCategorySelection(catKey);
          } else if (activeColumn === 1) {
            playChannel(chIndex);
          }
          break;

        case 10009: // Return / Back
        case 27:
          if (isFullscreen) {
            toggleFullscreen();
          }
          break;
      }
    });
  </script>
</body>
</html>
