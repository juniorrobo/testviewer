<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VIDAA Smart TV IPTV Player</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    :root {
      --bg: #0b0e14;
      --card-bg: #141a24;
      --card-active: #1d2636;
      --accent: #2563eb;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border: #232d3f;
      --locked: #ef4444;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background-color: var(--bg);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    #top-bar {
      height: 60px;
      background: #0f141d;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 32px;
    }
    .brand { font-size: 20px; font-weight: 700; color: #fff; }
    .brand span { color: var(--accent); }
    .top-actions { display: flex; gap: 16px; align-items: center; }
    .status-clock { color: var(--text-muted); font-size: 15px; font-weight: 500; }

    #dashboard {
      flex: 1;
      display: flex;
      height: calc(100vh - 60px);
      position: relative;
    }

    #col-categories {
      width: 280px;
      background: #111622;
      border-right: 1px solid var(--border);
      overflow-y: auto;
      list-style: none;
    }
    #col-channels {
      width: 380px;
      background: var(--card-bg);
      border-right: 1px solid var(--border);
      overflow-y: auto;
      list-style: none;
    }
    #col-preview {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: #000;
      position: relative;
    }

    .nav-item {
      padding: 16px 20px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      color: var(--text-muted);
    }
    .nav-item img {
      width: 32px;
      height: 32px;
      border-radius: 4px;
      object-fit: contain;
      background: #0b0e14;
    }
    .locked-badge {
      margin-left: auto;
      background: var(--locked);
      color: #fff;
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 700;
    }

    .focused {
      background-color: var(--accent) !important;
      color: #fff !important;
      outline: 3px solid #60a5fa;
      z-index: 5;
    }
    .selected {
      background-color: var(--card-active);
      color: #fff;
      font-weight: 600;
    }

    #video-wrapper {
      flex: 1;
      position: relative;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    video { width: 100%; height: 100%; object-fit: contain; }

    #channel-meta {
      padding: 24px;
      background: #0d121b;
      border-top: 1px solid var(--border);
      height: 120px;
    }
    #meta-title { font-size: 20px; font-weight: 600; margin-bottom: 6px; }
    #meta-sub { font-size: 14px; color: var(--text-muted); }

    .modal-overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(8px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }
    .dialog-box {
      background: #19202c;
      padding: 32px;
      border-radius: 12px;
      width: 440px;
      border: 1px solid var(--border);
    }
    .dialog-box h2 { margin-bottom: 16px; text-align: center; }
    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; font-size: 13px; color: var(--text-muted); margin-bottom: 6px; }
    .form-group input {
      width: 100%;
      padding: 12px;
      background: #0d1118;
      border: 1px solid var(--border);
      color: #fff;
      border-radius: 6px;
      font-size: 15px;
    }
    .dialog-actions { display: flex; justify-content: flex-end; gap: 12px; margin-top: 20px; }
    .btn {
      padding: 10px 18px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      font-size: 14px;
    }
    .btn-primary { background: var(--accent); color: white; }
    .btn-secondary { background: #334155; color: white; }

    .fullscreen-mode #col-categories,
    .fullscreen-mode #col-channels,
    .fullscreen-mode #top-bar,
    .fullscreen-mode #channel-meta {
      display: none !important;
    }
    .fullscreen-mode #dashboard { height: 100vh; }
  </style>
</head>
<body>

  <div id="top-bar">
    <div class="brand">VIDAA<span>PLAYER</span></div>
    <div class="top-actions">
      <button class="btn btn-secondary" onclick="openPinModal()">Set PIN</button>
      <button class="btn btn-secondary" onclick="openLogin()">Server Settings</button>
      <div class="status-clock" id="clock">--:--</div>
    </div>
  </div>

  <div id="dashboard">
    <ul id="col-categories"></ul>
    <ul id="col-channels"></ul>

    <div id="col-preview">
      <div id="video-wrapper">
        <video id="video" autoplay playsinline></video>
      </div>
      <div id="channel-meta">
        <div id="meta-title">Select a Channel</div>
        <div id="meta-sub">D-pad: Up/Down to Scroll • Right for Fullscreen • Left to Switch Panel</div>
      </div>
    </div>
  </div>

  <!-- Xtream Login Modal -->
  <div id="login-dialog" class="modal-overlay">
    <div class="dialog-box">
      <h2>Xtream Account Details</h2>
      <div class="form-group">
        <label>Server URL</label>
        <input type="text" id="cfg-server" placeholder="http://domain.com:8080" />
      </div>
      <div class="form-group">
        <label>Username</label>
        <input type="text" id="cfg-user" placeholder="Username" />
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="cfg-pass" placeholder="Password" />
      </div>
      <div class="dialog-actions">
        <button class="btn btn-secondary" onclick="closeLogin()">Cancel</button>
        <button class="btn btn-primary" onclick="submitLogin()">Connect</button>
      </div>
    </div>
  </div>

  <!-- Parental Control Modal -->
  <div id="pin-prompt-dialog" class="modal-overlay">
    <div class="dialog-box">
      <h2>Restricted Category</h2>
      <p style="font-size:14px; color:var(--text-muted); margin-bottom:16px; text-align:center;">Enter 4-digit PIN to access.</p>
      <div class="form-group">
        <input type="password" id="input-pin" maxlength="4" placeholder="••••" style="text-align: center; font-size: 24px; letter-spacing: 8px;" />
      </div>
      <div class="dialog-actions">
        <button class="btn btn-secondary" onclick="closePinPrompt()">Cancel</button>
        <button class="btn btn-primary" onclick="verifyPin()">Unlock</button>
      </div>
    </div>
  </div>

  <script>
    let serverUrl = '', username = '', password = '';
    let categoryList = [];
    let currentChannelList = [];
    let activeCategoryObj = null;
    let pendingRestrictedCategory = null;

    const restrictedKeywords = ['adult', 'xxx', '18+', 'nsfw', 'erotic'];

    let activeColumn = 0;
    let catIndex = 0;
    let chIndex = 0;
    let isFullscreen = false;

    const video = document.getElementById('video');
    const catContainer = document.getElementById('col-categories');
    const chContainer = document.getElementById('col-channels');
    let hls = null;

    setInterval(() => {
      const now = new Date();
      document.getElementById('clock').textContent = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }, 1000);

    window.addEventListener('DOMContentLoaded', () => {
      if (!localStorage.getItem('parental_pin')) {
        localStorage.setItem('parental_pin', '0000');
      }

      serverUrl = localStorage.getItem('xc_server') || '';
      username = localStorage.getItem('xc_user') || '';
      password = localStorage.getItem('xc_pass') || '';

      if (serverUrl && username && password) {
        loadData();
      } else {
        openLogin();
      }
    });

    function openLogin() {
      document.getElementById('cfg-server').value = serverUrl;
      document.getElementById('cfg-user').value = username;
      document.getElementById('cfg-pass').value = password;
      document.getElementById('login-dialog').style.display = 'flex';
    }
    function closeLogin() { document.getElementById('login-dialog').style.display = 'none'; }

    function openPinModal() {
      const current = localStorage.getItem('parental_pin') || '0000';
      const nextPin = prompt("Enter a new 4-digit parental PIN:", current);
      if (nextPin && nextPin.length === 4 && !isNaN(nextPin)) {
        localStorage.setItem('parental_pin', nextPin);
        alert("Parental PIN updated successfully.");
      } else if (nextPin) {
        alert("PIN must be exactly 4 digits.");
      }
    }

    function submitLogin() {
      serverUrl = document.getElementById('cfg-server').value.trim().replace(/\/$/, "");
      username = document.getElementById('cfg-user').value.trim();
      password = document.getElementById('cfg-pass').value.trim();

      if (!serverUrl || !username || !password) return;

      if (!serverUrl.startsWith('http://') && !serverUrl.startsWith('https://')) {
        serverUrl = 'http://' + serverUrl;
      }

      localStorage.setItem('xc_server', serverUrl);
      localStorage.setItem('xc_user', username);
      localStorage.setItem('xc_pass', password);
      closeLogin();
      loadData();
    }

    async function fetchWithProxyFallback(targetUrl) {
      const proxies = [
        `https://api.allorigins.win/raw?url=${encodeURIComponent(targetUrl)}`,
        `https://corsproxy.io/?${encodeURIComponent(targetUrl)}`,
        targetUrl
      ];

      for (let url of proxies) {
        try {
          const res = await fetch(url);
          if (res.ok) {
            const data = await res.json();
            return data;
          }
        } catch (e) {
          console.warn("Proxy attempt failed for:", url);
        }
      }
      return null;
    }

    async function loadData() {
      document.getElementById('meta-title').textContent = "Connecting to Xtream API...";
      
      const targetUrl = `${serverUrl}/player_api.php?username=${encodeURIComponent(username)}&password=${encodeURIComponent(password)}&action=get_live_categories`;
      const data = await fetchWithProxyFallback(targetUrl);

      if (data && Array.isArray(data)) {
        categoryList = data;
        renderCategories();
        if (categoryList.length > 0) {
          handleCategorySelection(0);
        }
      } else {
        document.getElementById('meta-title').textContent = "Connection Failed";
        document.getElementById('meta-sub').textContent = "Check credentials or server status.";
        alert("Could not retrieve channel categories. Please verify your credentials.");
      }
    }

    function isCategoryRestricted(name) {
      if (!name) return false;
      const lower = name.toLowerCase();
      return restrictedKeywords.some(keyword => lower.includes(keyword));
    }

    function renderCategories() {
      catContainer.innerHTML = '';
      categoryList.forEach((cat, idx) => {
        const li = document.createElement('li');
        li.className = 'nav-item' + (idx === catIndex ? ' selected' : '');
        li.id = `cat-${idx}`;

        const isLocked = isCategoryRestricted(cat.category_name);
        li.innerHTML = `<span>${cat.category_name}</span>` + (isLocked ? `<span class="locked-badge">LOCKED</span>` : '');

        li.onclick = () => handleCategorySelection(idx);
        catContainer.appendChild(li);
      });
      updateFocus();
    }

    function handleCategorySelection(idx) {
      catIndex = idx;
      const cat = categoryList[idx];
      if (!cat) return;

      if (isCategoryRestricted(cat.category_name)) {
        pendingRestrictedCategory = idx;
        document.getElementById('input-pin').value = '';
        document.getElementById('pin-prompt-dialog').style.display = 'flex';
      } else {
        fetchChannelsForCategory(cat.category_id);
      }
    }

    function closePinPrompt() {
      document.getElementById('pin-prompt-dialog').style.display = 'none';
      pendingRestrictedCategory = null;
    }

    function verifyPin() {
      const entered = document.getElementById('input-pin').value;
      const expected = localStorage.getItem('parental_pin') || '0000';

      if (entered === expected) {
        const targetIdx = pendingRestrictedCategory;
        closePinPrompt();
        if (targetIdx !== null) {
          const cat = categoryList[targetIdx];
          fetchChannelsForCategory(cat.category_id);
        }
      } else {
        alert("Incorrect PIN.");
        document.getElementById('input-pin').value = '';
      }
    }

    async function fetchChannelsForCategory(catId) {
      document.getElementById('meta-title').textContent = "Loading channels...";
      chContainer.innerHTML = '<li class="nav-item"><span>Loading...</span></li>';

      const targetUrl = `${serverUrl}/player_api.php?username=${encodeURIComponent(username)}&password=${encodeURIComponent(password)}&action=get_live_streams&category_id=${encodeURIComponent(catId)}`;
      const data = await fetchWithProxyFallback(targetUrl);

      if (data && Array.isArray(data)) {
        currentChannelList = data;
        chIndex = 0;
        renderChannels();
      } else {
        currentChannelList = [];
        chContainer.innerHTML = '<li class="nav-item"><span>No channels found</span></li>';
      }
    }

    function renderChannels() {
      chContainer.innerHTML = '';
      if (currentChannelList.length === 0) {
        chContainer.innerHTML = '<li class="nav-item"><span>No channels in category</span></li>';
        return;
      }

      currentChannelList.forEach((ch, idx) => {
        const li = document.createElement('li');
        li.className = 'nav-item';
        li.id = `ch-${idx}`;

        const img = document.createElement('img');
        img.src = ch.stream_icon || 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="%23666"><rect width="24" height="24" rx="4"/></svg>';
        img.onerror = () => { img.style.display = 'none'; };

        const span = document.createElement('span');
        span.textContent = ch.name;

        li.appendChild(img);
        li.appendChild(span);
        li.onclick = () => playChannel(idx);
        chContainer.appendChild(li);
      });
      updateFocus();
    }

    function playChannel(idx) {
      const ch = currentChannelList[idx];
      if (!ch) return;

      document.getElementById('meta-title').textContent = ch.name;
      document.getElementById('meta-sub').textContent = `Stream ID: ${ch.stream_id}`;

      let rawStreamUrl = `${serverUrl}/live/${encodeURIComponent(username)}/${encodeURIComponent(password)}/${ch.stream_id}.m3u8`;
      
      // Wrap stream in CORS proxy if site is HTTPS and stream URL is HTTP
      if (window.location.protocol === 'https:' && rawStreamUrl.startsWith('http:')) {
        rawStreamUrl = `https://corsproxy.io/?${encodeURIComponent(rawStreamUrl)}`;
      }

      if (Hls.isSupported()) {
        if (hls) hls.destroy();
        hls = new Hls();
        hls.loadSource(rawStreamUrl);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, () => video.play());
      } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = rawStreamUrl;
        video.play();
      }
    }

    function updateFocus() {
      document.querySelectorAll('.focused').forEach(el => el.classList.remove('focused'));

      if (activeColumn === 0) {
        const el = document.getElementById(`cat-${catIndex}`);
        if (el) {
          el.classList.add('focused');
          el.scrollIntoView({ block: 'nearest' });
        }
      } else if (activeColumn === 1) {
        const el = document.getElementById(`ch-${chIndex}`);
        if (el) {
          el.classList.add('focused');
          el.scrollIntoView({ block: 'nearest' });
        }
      }
    }

    function toggleFullscreen() {
      isFullscreen = !isFullscreen;
      if (isFullscreen) {
        document.body.classList.add('fullscreen-mode');
      } else {
        document.body.classList.remove('fullscreen-mode');
      }
    }

    // Remote Control Navigation (VIDAA OS Compatible)
    window.addEventListener('keydown', (e) => {
      if (document.getElementById('login-dialog').style.display === 'flex' ||
          document.getElementById('pin-prompt-dialog').style.display === 'flex') {
        if (e.keyCode === 13 && document.getElementById('pin-prompt-dialog').style.display === 'flex') {
          verifyPin();
        }
        return;
      }

      switch(e.keyCode) {
        case 38: // UP
          if (activeColumn === 0 && catIndex > 0) {
            catIndex--;
            updateFocus();
          } else if (activeColumn === 1 && chIndex > 0) {
            chIndex--;
            updateFocus();
          }
          break;

        case 40: // DOWN
          if (activeColumn === 0 && catIndex < categoryList.length - 1) {
            catIndex++;
            updateFocus();
          } else if (activeColumn === 1 && chIndex < currentChannelList.length - 1) {
            chIndex++;
            updateFocus();
          }
          break;

        case 37: // LEFT
          if (isFullscreen) {
            toggleFullscreen();
          } else if (activeColumn === 1) {
            activeColumn = 0;
            updateFocus();
          }
          break;

        case 39: // RIGHT
          if (activeColumn === 0) {
            activeColumn = 1;
            handleCategorySelection(catIndex);
          } else if (activeColumn === 1) {
            toggleFullscreen();
          }
          break;

        case 13: // ENTER / OK
          if (activeColumn === 0) {
            handleCategorySelection(catIndex);
            activeColumn = 1;
          } else if (activeColumn === 1) {
            playChannel(chIndex);
          }
          break;

        case 10009: // Return / Back (VIDAA / Tizen Remote)
        case 27:    // Esc Key
          if (isFullscreen) {
            toggleFullscreen();
          }
          break;
      }
    });
  </script>
</body>
</html>
