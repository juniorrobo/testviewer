<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VIDAA Ultra IPTV Player</title>
  <!-- Load HLS.js library for demuxing live streams on Smart TV browsers -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.7/dist/hls.min.js"></script>
  <style>
    :root {
      --bg: #090c10;
      --panel-bg: #111622;
      --card-bg: #171e2c;
      --card-hover: #1f293d;
      --accent: #2563eb;
      --accent-bright: #3b82f6;
      --text: #f8fafc;
      --text-dim: #94a3b8;
      --border: #232d3f;
      --danger: #ef4444;
      --success: #10b981;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      height: 100vh; width: 100vw;
      overflow: hidden;
      display: flex; flex-direction: column;
    }

    /* Top Navigation Bar */
    #header {
      height: 56px;
      background: #0d111a;
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 20px;
      z-index: 20;
    }
    .brand { font-size: 18px; font-weight: 800; color: #fff; letter-spacing: 0.5px; }
    .brand span { color: var(--accent-bright); }

    .nav-tabs { display: flex; gap: 8px; background: #05070a; padding: 4px; border-radius: 8px; border: 1px solid var(--border); }
    .tab { padding: 6px 16px; font-size: 12px; font-weight: 700; color: var(--text-dim); border-radius: 6px; cursor: pointer; transition: all 0.2s; }
    .tab.active { background: var(--accent); color: #fff; }

    .header-info { display: flex; align-items: center; gap: 14px; font-size: 13px; color: var(--text-dim); }

    /* Dashboard Grid Layout */
    #dashboard { flex: 1; display: flex; height: calc(100vh - 56px); }

    #col-cats { width: 280px; background: var(--panel-bg); border-right: 1px solid var(--border); overflow-y: auto; list-style: none; }
    #col-items { width: 380px; background: var(--card-bg); border-right: 1px solid var(--border); overflow-y: auto; list-style: none; }
    #col-preview { flex: 1; display: flex; flex-direction: column; background: #000; position: relative; }

    .list-item {
      padding: 12px 16px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.03);
      display: flex; align-items: center; gap: 12px;
      cursor: pointer; color: var(--text-dim); font-size: 13px;
    }
    .list-item img { width: 32px; height: 32px; object-fit: contain; border-radius: 4px; background: #05070a; }
    .list-item .title { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* D-Pad Focus Rings for TV Navigation */
    .focused {
      background-color: var(--accent) !important;
      color: #fff !important;
      outline: 3px solid #60a5fa !important;
      outline-offset: -3px;
      z-index: 10;
    }
    .selected { background-color: var(--card-hover); color: #fff; font-weight: 600; }

    /* Preview Player & Status Dashboard */
    #preview-player-box { flex: 1; position: relative; background: #000; display: flex; align-items: center; justify-content: center; }
    #preview-video { width: 100%; height: 100%; object-fit: contain; }

    #video-loader {
      position: absolute; display: none; flex-direction: column; align-items: center; justify-content: center;
      gap: 10px; background: rgba(0,0,0,0.75); padding: 20px; border-radius: 12px; border: 1px solid var(--border);
    }
    .spinner { width: 32px; height: 32px; border: 3px solid var(--border); border-top-color: var(--accent-bright); border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    #meta-panel {
      height: 120px; background: #0a0e17; border-top: 1px solid var(--border);
      padding: 16px 20px; display: flex; justify-content: space-between; align-items: center;
    }
    .meta-info { display: flex; flex-direction: column; gap: 4px; }
    #meta-title { font-size: 18px; font-weight: 800; color: #fff; }
    #meta-sub { font-size: 13px; color: var(--text-dim); }
    .badge { font-size: 10px; padding: 2px 6px; border-radius: 4px; font-weight: 700; text-transform: uppercase; display: inline-block; width: fit-content; margin-top: 4px; }
    .badge-live { background: var(--danger); color: #fff; }
    .badge-vod { background: var(--accent); color: #fff; }

    .action-btns { display: flex; gap: 10px; }

    /* Fullscreen Dedicated Player Overlay */
    #player-overlay {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: #000; z-index: 999; display: none; flex-direction: column;
    }
    #full-video { width: 100%; height: 100%; object-fit: contain; }
    #player-osd {
      position: absolute; bottom: 0; left: 0; right: 0;
      background: linear-gradient(transparent, rgba(0,0,0,0.95));
      padding: 30px; display: flex; justify-content: space-between; align-items: flex-end;
      pointer-events: none;
    }
    .osd-title { font-size: 26px; font-weight: 800; color: #fff; }
    .osd-status { font-size: 14px; color: var(--accent-bright); font-weight: 700; margin-top: 4px; }
    .osd-hint { font-size: 13px; color: var(--text-dim); }

    /* Modals for Settings & Series Browsing */
    .modal { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.85); z-index: 1000; display: none; align-items: center; justify-content: center; }
    .dialog { background: #18202c; padding: 24px; border-radius: 12px; width: 480px; border: 1px solid var(--border); max-height: 85vh; display: flex; flex-direction: column; }
    .dialog h3 { margin-bottom: 14px; font-size: 18px; }
    .dialog input { width: 100%; padding: 12px; margin-bottom: 12px; background: #0a0d14; border: 1px solid var(--border); color: #fff; border-radius: 6px; font-size: 14px; }
    .dialog-btns { display: flex; justify-content: flex-end; gap: 10px; margin-top: 10px; }
    .btn { padding: 10px 18px; border: none; border-radius: 6px; cursor: pointer; font-weight: 700; font-size: 13px; }
    .btn-blue { background: var(--accent); color: #fff; }
    .btn-gray { background: #334155; color: #fff; }

    #episodes-container { overflow-y: auto; flex: 1; margin: 10px 0; display: flex; flex-direction: column; gap: 6px; }
    .ep-item { padding: 10px; background: #0d121d; border-radius: 6px; cursor: pointer; display: flex; justify-content: space-between; font-size: 13px; }
    .ep-item:hover { background: var(--accent); }
  </style>
</head>
<body>

  <!-- Top Header Navigation -->
  <div id="header">
    <div class="brand">VIDAA<span>PLAYER</span></div>
    <div class="nav-tabs">
      <div class="tab active" id="tab-live" onclick="switchSection('live')">CHANNELS</div>
      <div class="tab" id="tab-vod" onclick="switchSection('vod')">MOVIES</div>
      <div class="tab" id="tab-series" onclick="switchSection('series')">SERIES</div>
      <div class="tab" id="tab-radio" onclick="switchSection('radio')">RADIO</div>
    </div>
    <div class="header-info">
      <button class="btn btn-gray" id="btn-settings" onclick="openLogin()">Server Settings</button>
      <div id="clock">--:--</div>
    </div>
  </div>

  <!-- Content Dashboard -->
  <div id="dashboard">
    <ul id="col-cats"></ul>
    <ul id="col-items"></ul>

    <div id="col-preview">
      <div id="preview-player-box">
        <video id="preview-video" autoplay muted playsinline></video>
        <div id="video-loader">
          <div class="spinner"></div>
          <span id="loader-text" style="font-size: 12px; color: var(--text-dim);">Connecting stream...</span>
        </div>
      </div>

      <div id="meta-panel">
        <div class="meta-info">
          <div id="meta-title">Select a Channel or Movie</div>
          <div id="meta-sub">Press OK / ENTER or RIGHT to expand</div>
          <div id="meta-badge" class="badge badge-live">READY</div>
        </div>
        <div class="action-btns">
          <button class="btn btn-gray" id="btn-retry" onclick="retryStream()">Retry Stream</button>
          <button class="btn btn-blue" id="btn-fullscreen" onclick="openFullscreen()">Fullscreen [OK]</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Dedicated Fullscreen Player Overlay Modal -->
  <div id="player-overlay">
    <video id="full-video" autoplay playsinline></video>
    <div id="player-osd">
      <div>
        <div class="osd-title" id="full-title">Channel Name</div>
        <div class="osd-status" id="full-status">CONNECTING...</div>
      </div>
      <div class="osd-hint">Press [BACK / ESC] to exit Fullscreen</div>
    </div>
  </div>

  <!-- Server Settings Modal -->
  <div id="login-modal" class="modal">
    <div class="dialog">
      <h3>Xtream IPTV Credentials</h3>
      <input type="text" id="cfg-server" placeholder="http://domain.com:8080" />
      <input type="text" id="cfg-user" placeholder="Username" />
      <input type="password" id="cfg-pass" placeholder="Password" />
      <div class="dialog-btns">
        <button class="btn btn-gray" onclick="closeLogin()">Cancel</button>
        <button class="btn btn-blue" onclick="saveLogin()">Connect Server</button>
      </div>
    </div>
  </div>

  <!-- Series Seasons & Episode Browser Modal -->
  <div id="series-modal" class="modal">
    <div class="dialog">
      <h3 id="series-modal-title">Series Episodes</h3>
      <div id="episodes-container"></div>
      <div class="dialog-btns">
        <button class="btn btn-gray" onclick="closeSeriesModal()">Close</button>
      </div>
    </div>
  </div>

  <script>
    let serverUrl = '', username = '', password = '';
    let currentSection = 'live'; // 'live', 'vod', 'series', 'radio'
    let categoryList = [];
    let currentItemList = [];

    // Navigation Focus Matrix: -1 = Tabs/Action Bar, 0 = Categories, 1 = Content Items, 2 = Fullscreen Player, 3 = Series Modal
    let focusCol = 0;
    let tabIdx = 0;
    let catIdx = 0;
    let itemIdx = 0;
    let actionIdx = 0;

    const tabs = ['live', 'vod', 'series', 'radio'];
    const pVideo = document.getElementById('preview-video');
    const fVideo = document.getElementById('full-video');
    let previewHls = null;
    let fullHls = null;

    // Clock
    setInterval(() => {
      document.getElementById('clock').textContent = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }, 1000);

    window.addEventListener('DOMContentLoaded', () => {
      serverUrl = localStorage.getItem('xc_server') || '';
      username = localStorage.getItem('xc_user') || '';
      password = localStorage.getItem('xc_pass') || '';

      if (serverUrl && username && password) {
        loadCategories();
      } else {
        openLogin();
      }
    });

    function openLogin() {
      document.getElementById('cfg-server').value = serverUrl;
      document.getElementById('cfg-user').value = username;
      document.getElementById('cfg-pass').value = password;
      document.getElementById('login-modal').style.display = 'flex';
    }
    function closeLogin() { document.getElementById('login-modal').style.display = 'none'; }

    function saveLogin() {
      serverUrl = document.getElementById('cfg-server').value.trim().replace(/\/$/, "");
      username = document.getElementById('cfg-user').value.trim();
      password = document.getElementById('cfg-pass').value.trim();

      if (!serverUrl.startsWith('http://') && !serverUrl.startsWith('https://')) {
        serverUrl = 'http://' + serverUrl;
      }

      localStorage.setItem('xc_server', serverUrl);
      localStorage.setItem('xc_user', username);
      localStorage.setItem('xc_pass', password);
      closeLogin();
      loadCategories();
    }

    // CORS & HTTPS Fallback Proxy Fetcher
    async function fetchFast(url) {
      try {
        const res = await fetch(url);
        if (res.ok) return await res.json();
      } catch (e) {
        try {
          const proxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`;
          const res = await fetch(proxyUrl);
          if (res.ok) return await res.json();
        } catch (err) {
          console.error("API Fetch Error:", url, err);
        }
      }
      return null;
    }

    function switchSection(sec) {
      currentSection = sec;
      tabIdx = tabs.indexOf(sec);
      document.querySelectorAll('.tab').forEach((t, i) => {
        t.classList.toggle('active', i === tabIdx);
      });
      catIdx = 0; itemIdx = 0;
      loadCategories();
    }

    async function loadCategories() {
      document.getElementById('col-cats').innerHTML = '<li class="list-item"><span class="title">Loading Categories...</span></li>';
      document.getElementById('col-items').innerHTML = '';

      let action = 'get_live_categories';
      if (currentSection === 'vod') action = 'get_vod_categories';
      if (currentSection === 'series') action = 'get_series_categories';

      const url = `${serverUrl}/player_api.php?username=${encodeURIComponent(username)}&password=${encodeURIComponent(password)}&action=${action}`;
      let data = await fetchFast(url);

      if (data && Array.isArray(data)) {
        if (currentSection === 'radio') {
          data = data.filter(c => c.category_name.toLowerCase().includes('radio') || c.category_name.toLowerCase().includes('fm'));
        }
        categoryList = data;
        renderCategories();
        if (categoryList.length > 0) loadItems(0);
      } else {
        document.getElementById('col-cats').innerHTML = '<li class="list-item"><span class="title">Failed to load</span></li>';
      }
    }

    function renderCategories() {
      const container = document.getElementById('col-cats');
      container.innerHTML = '';
      categoryList.forEach((cat, idx) => {
        const li = document.createElement('li');
        li.className = 'list-item' + (idx === catIdx ? ' selected' : '');
        li.id = `cat-${idx}`;
        li.innerHTML = `<span class="title">${cat.category_name}</span>`;
        li.onclick = () => { catIdx = idx; loadItems(idx); };
        container.appendChild(li);
      });
      updateFocus();
    }

    async function loadItems(cIdx) {
      catIdx = cIdx;
      const cat = categoryList[cIdx];
      if (!cat) return;

      document.getElementById('col-items').innerHTML = '<li class="list-item"><span class="title">Loading items...</span></li>';

      let action = 'get_live_streams';
      if (currentSection === 'vod') action = 'get_vod_streams';
      if (currentSection === 'series') action = 'get_series';

      const url = `${serverUrl}/player_api.php?username=${encodeURIComponent(username)}&password=${encodeURIComponent(password)}&action=${action}&category_id=${encodeURIComponent(cat.category_id)}`;
      const data = await fetchFast(url);

      if (data && Array.isArray(data)) {
        currentItemList = data;
        itemIdx = 0;
        renderItems();
      } else {
        currentItemList = [];
        document.getElementById('col-items').innerHTML = '<li class="list-item"><span class="title">No items found</span></li>';
      }
    }

    function renderItems() {
      const container = document.getElementById('col-items');
      container.innerHTML = '';
      currentItemList.forEach((item, idx) => {
        const li = document.createElement('li');
        li.className = 'list-item';
        li.id = `item-${idx}`;

        const name = item.name || item.title;
        const icon = item.stream_icon || item.cover || '';

        li.innerHTML = `
          ${icon ? `<img src="${icon}" onerror="this.style.display='none'"/>` : ''}
          <span class="title">${name}</span>
        `;
        li.onclick = () => { itemIdx = idx; handleItemSelect(false); };
        container.appendChild(li);
      });
      updateFocus();
    }

    function showLoader(show, text = 'Connecting stream...') {
      const loader = document.getElementById('video-loader');
      document.getElementById('loader-text').textContent = text;
      loader.style.display = show ? 'flex' : 'none';
    }

    function handleItemSelect(fullScreen = false) {
      const item = currentItemList[itemIdx];
      if (!item) return;

      if (currentSection === 'series') {
        loadSeriesEpisodes(item);
      } else {
        playStream(item, fullScreen);
      }
    }

    function playStream(item, fullScreen = false) {
      const title = item.name || item.title;
      document.getElementById('meta-title').textContent = title;
      document.getElementById('meta-sub').textContent = `Stream ID: ${item.stream_id || item.id || 'N/A'}`;
      document.getElementById('meta-badge').textContent = currentSection.toUpperCase();

      let streamUrl = '';
      let fallbackTsUrl = '';

      if (currentSection === 'vod') {
        const ext = item.container_extension || 'mp4';
        streamUrl = `${serverUrl}/movie/${encodeURIComponent(username)}/${encodeURIComponent(password)}/${item.stream_id}.${ext}`;
      } else if (item.is_episode) {
        const ext = item.container_extension || 'mp4';
        streamUrl = `${serverUrl}/series/${encodeURIComponent(username)}/${encodeURIComponent(password)}/${item.id}.${ext}`;
      } else {
        // Live IPTV: Generate both HLS m3u8 and fallback direct MPEG-TS URLs
        streamUrl = `${serverUrl}/live/${encodeURIComponent(username)}/${encodeURIComponent(password)}/${item.stream_id}.m3u8`;
        fallbackTsUrl = `${serverUrl}/live/${encodeURIComponent(username)}/${encodeURIComponent(password)}/${item.stream_id}.ts`;
      }

      const targetVideo = fullScreen ? fVideo : pVideo;
      let activeHls = fullScreen ? fullHls : previewHls;

      if (fullScreen) {
        focusCol = 2;
        document.getElementById('full-title').textContent = title;
        document.getElementById('full-status').textContent = 'BUFFERING STREAM...';
        document.getElementById('player-overlay').style.display = 'flex';
      } else {
        showLoader(true, 'Connecting stream...');
      }

      // Cleanup existing HLS instance
      if (activeHls) { activeHls.destroy(); activeHls = null; }

      // Direct VOD MP4/MKV Playback Engine
      if (currentSection === 'vod' || item.is_episode) {
        targetVideo.src = streamUrl;
        targetVideo.play().then(() => showLoader(false)).catch(e => {
          console.warn("Direct VOD Playback Error:", e);
          showLoader(false);
        });
        return;
      }

      // Live Stream Playback Engine (HLS.js Demuxing with Native MPEG-TS Fallback)
      if (Hls.isSupported()) {
        activeHls = new Hls({
          enableWorker: true,
          lowLatencyMode: true,
          xhrSetup: function (xhr, url) {
            // Handle Mixed Content (HTTP streams on HTTPS deployment)
            if (window.location.protocol === 'https:' && url.startsWith('http:')) {
              xhr.open('GET', `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`, true);
            }
          }
        });

        let playSource = streamUrl;
        if (window.location.protocol === 'https:' && playSource.startsWith('http:')) {
          playSource = `https://api.allorigins.win/raw?url=${encodeURIComponent(playSource)}`;
        }

        activeHls.loadSource(playSource);
        activeHls.attachMedia(targetVideo);

        activeHls.on(Hls.Events.MANIFEST_PARSED, () => {
          showLoader(false);
          if (fullScreen) document.getElementById('full-status').textContent = 'LIVE PLAYBACK';
          targetVideo.play().catch(e => console.log("Play error:", e));
        });

        activeHls.on(Hls.Events.ERROR, (event, data) => {
          if (data.fatal) {
            console.warn("HLS fatal error. Triggering fallback to direct TS stream...");
            if (activeHls) activeHls.destroy();
            targetVideo.src = fallbackTsUrl;
            targetVideo.play().then(() => showLoader(false)).catch(err => {
              showLoader(false);
              if (fullScreen) document.getElementById('full-status').textContent = 'PLAYBACK ERROR';
            });
          }
        });

        if (fullScreen) fullHls = activeHls; else previewHls = activeHls;

      } else if (targetVideo.canPlayType('application/vnd.apple.mpegurl')) {
        targetVideo.src = streamUrl;
        targetVideo.play().then(() => showLoader(false));
      } else {
        targetVideo.src = fallbackTsUrl;
        targetVideo.play().then(() => showLoader(false));
      }
    }

    function retryStream() {
      if (currentItemList[itemIdx]) playStream(currentItemList[itemIdx], false);
    }

    function openFullscreen() {
      if (currentItemList[itemIdx]) playStream(currentItemList[itemIdx], true);
    }

    function closeFullscreen() {
      focusCol = 1;
      if (fullHls) { fullHls.destroy(); fullHls = null; }
      fVideo.pause();
      fVideo.src = '';
      document.getElementById('player-overlay').style.display = 'none';
      updateFocus();
    }

    async function loadSeriesEpisodes(seriesItem) {
      document.getElementById('series-modal-title').textContent = seriesItem.name || seriesItem.title;
      const container = document.getElementById('episodes-container');
      container.innerHTML = '<div style="color:var(--text-dim); text-align:center; padding:20px;">Loading episodes...</div>';
      document.getElementById('series-modal').style.display = 'flex';

      const url = `${serverUrl}/player_api.php?username=${encodeURIComponent(username)}&password=${encodeURIComponent(password)}&action=get_series_info&series_id=${seriesItem.series_id}`;
      const data = await fetchFast(url);

      if (data && data.episodes) {
        container.innerHTML = '';
        Object.keys(data.episodes).forEach(seasonNum => {
          data.episodes[seasonNum].forEach(ep => {
            const div = document.createElement('div');
            div.className = 'ep-item';
            div.innerHTML = `<span>S${seasonNum} E${ep.episode_num} - ${ep.title}</span><span style="color:var(--accent-bright)">PLAY</span>`;
            div.onclick = () => {
              closeSeriesModal();
              playStream({ id: ep.id, title: ep.title, container_extension: ep.container_extension, is_episode: true }, true);
            };
            container.appendChild(div);
          });
        });
      } else {
        container.innerHTML = '<div style="color:var(--danger); text-align:center; padding:20px;">No episodes found</div>';
      }
    }

    function closeSeriesModal() {
      document.getElementById('series-modal').style.display = 'none';
    }

    function updateFocus() {
      document.querySelectorAll('.focused').forEach(e => e.classList.remove('focused'));

      if (focusCol === -1) {
        if (actionIdx === 0) document.getElementById(`tab-${tabs[tabIdx]}`)?.classList.add('focused');
        else if (actionIdx === 1) document.getElementById('btn-settings')?.classList.add('focused');
        else if (actionIdx === 2) document.getElementById('btn-retry')?.classList.add('focused');
        else if (actionIdx === 3) document.getElementById('btn-fullscreen')?.classList.add('focused');
      } else if (focusCol === 0) {
        const c = document.getElementById(`cat-${catIdx}`);
        if (c) { c.classList.add('focused'); c.scrollIntoView({ block: 'nearest' }); }
      } else if (focusCol === 1) {
        const i = document.getElementById(`item-${itemIdx}`);
        if (i) { i.classList.add('focused'); i.scrollIntoView({ block: 'nearest' }); }
      }
    }

    window.addEventListener('keydown', (e) => {
      // Ignore background TV keys if modals are open
      if (document.getElementById('login-modal').style.display === 'flex') return;

      if (focusCol === 2) { // Fullscreen Overlay Mode
        if (e.keyCode === 27 || e.keyCode === 10009 || e.keyCode === 8) { // ESC / BACK
          closeFullscreen();
        }
        return;
      }

      if (document.getElementById('series-modal').style.display === 'flex') {
        if (e.keyCode === 27 || e.keyCode === 10009 || e.keyCode === 8) closeSeriesModal();
        return;
      }

      switch(e.keyCode) {
        case 38: // UP
          if (focusCol === 0 && catIdx > 0) { catIdx--; updateFocus(); }
          else if (focusCol === 1 && itemIdx > 0) { itemIdx--; updateFocus(); }
          else if (focusCol === 0 && catIdx === 0) { focusCol = -1; actionIdx = 0; updateFocus(); }
          else if (focusCol === 1 && itemIdx === 0) { focusCol = -1; actionIdx = 2; updateFocus(); }
          break;

        case 40: // DOWN
          if (focusCol === -1) { focusCol = 0; updateFocus(); }
          else if (focusCol === 0 && catIdx < categoryList.length - 1) { catIdx++; updateFocus(); }
          else if (focusCol === 1 && itemIdx < currentItemList.length - 1) { itemIdx++; updateFocus(); }
          break;

        case 37: // LEFT
          if (focusCol === -1 && actionIdx > 0) { actionIdx--; updateFocus(); }
          else if (focusCol === 1) { focusCol = 0; updateFocus(); }
          break;

        case 39: // RIGHT
          if (focusCol === -1 && actionIdx < 3) { actionIdx++; updateFocus(); }
          else if (focusCol === 0) { focusCol = 1; loadItems(catIdx); }
          else if (focusCol === 1) { handleItemSelect(true); } // Double OK / Right launches Fullscreen
          break;

        case 13: // ENTER / OK
          if (focusCol === -1) {
            if (actionIdx === 0) switchSection(tabs[tabIdx]);
            else if (actionIdx === 1) openLogin();
            else if (actionIdx === 2) retryStream();
            else if (actionIdx === 3) openFullscreen();
          } else if (focusCol === 0) {
            focusCol = 1; loadItems(catIdx);
          } else if (focusCol === 1) {
            handleItemSelect(true);
          }
          break;
      }
    });
  </script>
</body>
</html>
